server:
  port: 8080

spring:
  application:
    name: fintech-payment-engine
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech_db}
    username: ${SPRING_DATASOURCE_USERNAME:fintech_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fintech_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.fintech: DEBUG
    org.springframework.transaction: INFO
    org.hibernate.SQL: INFO

fintech:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  webhooks:
    stripe:
      secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_stripe_secret_key_12345}
    paystack:
      secret: ${PAYSTACK_WEBHOOK_SECRET:whsec_test_paystack_secret_key_12345}
    flutterwave:
      secret: ${FLUTTERWAVE_WEBHOOK_SECRET:whsec_test_flutterwave_secret_key_12345}
  payouts:
    flat-fee: 2.00

