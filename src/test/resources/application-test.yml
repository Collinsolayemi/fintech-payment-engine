spring:
  datasource:
    url: jdbc:h2:mem:fintech_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

fintech:
  reconciliation:
    scheduler:
      enabled: false

